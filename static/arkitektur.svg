<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" font-family="'Segoe UI', system-ui, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2dd4bf"/>
    </marker>
    <linearGradient id="switchGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- bakgrunn -->
  <rect x="0" y="0" width="1180" height="720" fill="#0b1220"/>

  <!-- tittel -->
  <text x="40" y="48" fill="#e2e8f0" font-size="26" font-weight="700">Call-senter AI — arkitektur (Loyalty)</text>
  <text x="40" y="74" fill="#94a3b8" font-size="15">Samme kode. Provider-laget byttes med én env-variabel: DEPLOY_TARGET=local vs azure</text>

  <!-- DEPLOY_TARGET-bryter -->
  <g>
    <rect x="760" y="28" width="380" height="58" rx="10" fill="#0f1b2d" stroke="#2dd4bf" stroke-width="1.5"/>
    <text x="780" y="52" fill="#94a3b8" font-size="13" font-weight="600">DEPLOY_TARGET</text>
    <rect x="780" y="58" width="86" height="20" rx="10" fill="url(#switchGrad)"/>
    <text x="823" y="72" fill="#06231f" font-size="12" font-weight="700" text-anchor="middle">local</text>
    <text x="876" y="72" fill="#64748b" font-size="12">↔</text>
    <rect x="892" y="58" width="86" height="20" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="935" y="72" fill="#94a3b8" font-size="12" font-weight="700" text-anchor="middle">azure</text>
    <text x="996" y="72" fill="#64748b" font-size="12">styrer STT + LLM</text>
  </g>

  <!-- ====== 1. KILDE ====== -->
  <rect x="40" y="120" width="200" height="100" rx="12" fill="#11203a" stroke="#334155"/>
  <text x="140" y="152" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle">Samtale / lyd</text>
  <text x="140" y="176" fill="#94a3b8" font-size="12" text-anchor="middle">Innkommende + utgående</text>
  <text x="140" y="194" fill="#94a3b8" font-size="12" text-anchor="middle">norske kundesamtaler</text>
  <text x="140" y="212" fill="#64748b" font-size="11" text-anchor="middle">(demo: ferdige transkript)</text>

  <!-- ====== 2. STT-lag ====== -->
  <rect x="300" y="108" width="270" height="156" rx="12" fill="#0f1b2d" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="435" y="134" fill="#2dd4bf" font-size="15" font-weight="700" text-anchor="middle">STT-lag — tale til tekst</text>
  <text x="435" y="153" fill="#64748b" font-size="11" text-anchor="middle">app/providers/stt.py · pluggbart</text>
  <rect x="320" y="166" width="230" height="34" rx="7" fill="#11271f" stroke="#0d9488"/>
  <text x="435" y="188" fill="#5eead4" font-size="12.5" font-weight="600" text-anchor="middle">LOKAL: NB-Whisper / faster-whisper</text>
  <rect x="320" y="208" width="230" height="34" rx="7" fill="#1e293b" stroke="#475569"/>
  <text x="435" y="230" fill="#cbd5e1" font-size="12.5" font-weight="600" text-anchor="middle">AZURE: Azure AI Speech (nb-NO)</text>

  <!-- ====== 3. LLM-lag ====== -->
  <rect x="630" y="108" width="270" height="156" rx="12" fill="#0f1b2d" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="765" y="134" fill="#2dd4bf" font-size="15" font-weight="700" text-anchor="middle">LLM-lag — analyse</text>
  <text x="765" y="153" fill="#64748b" font-size="11" text-anchor="middle">app/providers/llm.py · pluggbart</text>
  <rect x="650" y="166" width="230" height="34" rx="7" fill="#11271f" stroke="#0d9488"/>
  <text x="765" y="188" fill="#5eead4" font-size="12.5" font-weight="600" text-anchor="middle">LOKAL: mock-regler / Anthropic</text>
  <rect x="650" y="208" width="230" height="34" rx="7" fill="#1e293b" stroke="#475569"/>
  <text x="765" y="230" fill="#cbd5e1" font-size="12.5" font-weight="600" text-anchor="middle">AZURE: Azure OpenAI (EU)</text>

  <!-- felles kontrakt-note -->
  <text x="765" y="290" fill="#64748b" font-size="11.5" text-anchor="middle">Begge backends returnerer SAMME pydantic-modeller (Transcript, Analysis)</text>

  <!-- ====== 4. ANALYSE-RESULTAT ====== -->
  <rect x="300" y="330" width="600" height="150" rx="12" fill="#11203a" stroke="#334155"/>
  <text x="600" y="358" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle">AI-analyse per samtale (Analysis-modell)</text>
  <!-- chips -->
  <g font-size="12" font-weight="600">
    <rect x="322" y="376" width="160" height="30" rx="15" fill="#0f2b27" stroke="#0d9488"/><text x="402" y="396" fill="#5eead4" text-anchor="middle">QA-scorecard (6 punkt)</text>
    <rect x="494" y="376" width="120" height="30" rx="15" fill="#0f2b27" stroke="#0d9488"/><text x="554" y="396" fill="#5eead4" text-anchor="middle">Sammendrag</text>
    <rect x="626" y="376" width="110" height="30" rx="15" fill="#0f2b27" stroke="#0d9488"/><text x="681" y="396" fill="#5eead4" text-anchor="middle">Sentiment</text>
    <rect x="748" y="376" width="130" height="30" rx="15" fill="#0f2b27" stroke="#0d9488"/><text x="813" y="396" fill="#5eead4" text-anchor="middle">Compliance-flagg</text>

    <rect x="322" y="416" width="135" height="30" rx="15" fill="#1b2740" stroke="#475569"/><text x="389" y="436" fill="#cbd5e1" text-anchor="middle">Churn-risiko</text>
    <rect x="469" y="416" width="150" height="30" rx="15" fill="#1b2740" stroke="#475569"/><text x="544" y="436" fill="#cbd5e1" text-anchor="middle">Coaching-tips</text>
    <rect x="631" y="416" width="135" height="30" rx="15" fill="#1b2740" stroke="#475569"/><text x="698" y="436" fill="#cbd5e1" text-anchor="middle">Henvendelsesårsak</text>
    <rect x="778" y="416" width="100" height="30" rx="15" fill="#1b2740" stroke="#475569"/><text x="828" y="436" fill="#cbd5e1" text-anchor="middle">Oppfølging</text>
  </g>
  <text x="600" y="468" fill="#64748b" font-size="11" text-anchor="middle">script_adherence (%) · key_info (intent/produkt/utfall/neste steg)</text>

  <!-- ====== 5. UTTAK ====== -->
  <!-- Dashboard -->
  <rect x="300" y="540" width="280" height="120" rx="12" fill="#0f1b2d" stroke="#2dd4bf" stroke-width="1.5"/>
  <text x="440" y="568" fill="#2dd4bf" font-size="15" font-weight="700" text-anchor="middle">UI / Dashboard</text>
  <text x="440" y="590" fill="#94a3b8" font-size="12" text-anchor="middle">Samtale-side: transkript + analyse</text>
  <text x="440" y="610" fill="#94a3b8" font-size="12" text-anchor="middle">Ledelses-dashboard (/dashboard):</text>
  <text x="440" y="628" fill="#94a3b8" font-size="12" text-anchor="middle">snitt-QA, sentiment, churn, topp-flagg</text>
  <text x="440" y="648" fill="#64748b" font-size="11" text-anchor="middle">FastAPI + Jinja2 · app/main.py</text>

  <!-- CRM-eksport -->
  <rect x="620" y="540" width="280" height="120" rx="12" fill="#11203a" stroke="#334155"/>
  <text x="760" y="568" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle">CRM-eksport</text>
  <text x="760" y="590" fill="#94a3b8" font-size="12" text-anchor="middle">Strukturert JSON per samtale:</text>
  <text x="760" y="610" fill="#94a3b8" font-size="12" text-anchor="middle">intent · produkt · utfall · neste steg</text>
  <text x="760" y="630" fill="#94a3b8" font-size="12" text-anchor="middle">prioritet · churn_risk · samtaletype</text>
  <text x="760" y="650" fill="#64748b" font-size="11" text-anchor="middle">klar for ticket-/CRM-berikelse</text>

  <!-- ====== piler ====== -->
  <!-- kilde -> STT -->
  <line x1="240" y1="170" x2="296" y2="180" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- STT -> LLM -->
  <line x1="570" y1="186" x2="626" y2="186" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- LLM -> analyse -->
  <line x1="765" y1="264" x2="700" y2="326" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- STT -> analyse (transkript vises også) -->
  <line x1="435" y1="264" x2="500" y2="326" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <!-- analyse -> dashboard -->
  <line x1="500" y1="480" x2="455" y2="536" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- analyse -> CRM -->
  <line x1="700" y1="480" x2="750" y2="536" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- env-bryter forklaring nederst -->
  <text x="960" y="566" fill="#94a3b8" font-size="12" font-weight="600">Bryteren i praksis</text>
  <rect x="940" y="578" width="210" height="84" rx="9" fill="#0f1b2d" stroke="#334155"/>
  <text x="952" y="600" fill="#5eead4" font-size="11.5" font-family="monospace">local  → STT=mock/whisper</text>
  <text x="952" y="618" fill="#5eead4" font-size="11.5" font-family="monospace">         LLM=mock/anthropic</text>
  <text x="952" y="640" fill="#cbd5e1" font-size="11.5" font-family="monospace">azure → STT=azure-speech</text>
  <text x="952" y="658" fill="#cbd5e1" font-size="11.5" font-family="monospace">         LLM=azure-openai</text>
</svg>
